name: mobilevim
description: Uma IDE móvel estilo Neovim para desenvolvimento web e backend
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.5
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  permission_handler: ^11.0.0
  file_picker: ^11.0.2
  http: ^1.1.0
  url_launcher: ^6.1.12
  github: ^9.16.0
  flutter_secure_storage: ^8.0.0
  xterm: ^3.5.0
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  tuple: ^2.0.2
  rxdart: ^0.27.7
  collection: ^1.18.0
  intl: ^0.20.2
  package_info_plus: ^4.1.0
  device_info_plus: ^9.0.3
  share_plus: ^7.1.0
  uni_links: ^0.5.1
  webview_flutter: ^4.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3

flutter:
  uses-material-design: true
  
  assets:
    - assets/themes/
    - assets/templates/
    - assets/plugins/
  
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-Italic.ttf
          style: italic
